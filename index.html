<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Карта ответов Прохора</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#16202A;--muted:#566271;--line:#BCC6D0;--acc:#2A64B4;--bad:#BF2F4C}
@media (prefers-color-scheme:dark){:root{--bg:#0E1318;--card:#18212A;--ink:#E6EBF0;--muted:#9BA7B4;--line:#33404D;--acc:#6EA2F0;--bad:#F2728B;color-scheme:dark}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:0 16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer;transition:transform 140ms cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.97)}button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13.5px;min-height:1.2em}
</style></head><body>
<form id="f"><h1>Карта ответов Прохора</h1><p>Страница под паролем. Пароль — у того, кто прислал ссылку.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="Пароль" required autofocus>
<label><input type="checkbox" id="rem"> Запомнить на этом устройстве</label>
<button id="go">Открыть</button><div id="err" role="alert"></div></form>
